version: '3.8'

services:
  # Task Tracker API Service
  task-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-tracker-api
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - rabbitmq
    networks:
      - task-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # RabbitMQ Message Broker (for future notification service integration)
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: task-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - task-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  task-network:
    driver: bridge

volumes:
  rabbitmq_data:
    driver: local
